<section>
    <div>
        <div class="content">
            <div class="logo__container">
                <button (click)="openHome()" class="logo"></button>
            </div>
            <h2 class="mobile">&copy; Simon Heistermann {{ currentYear }}</h2>
            <div class="social__media">
                <a href="https://github.com/SimonHeistermann" target="_blank" rel="noopener noreferrer">
                    <button class="github__btn"></button>
                </a>
                <a href="mailto:simon@heistermann-solutions.de" target="_blank" rel="noopener noreferrer">
                    <button class="email__btn"></button>
                </a>
                <a href="https://www.linkedin.com/in/simon-maximilian-heistermann-419531250/" target="_blank" rel="noopener noreferrer">
                    <button class="linkedin__btn"></button>
                </a>
            </div>
            <div class="legal__links mobile">
                <a class="legal__notice__a" [routerLink]="['/legal-notice']">
                    <button><span>{{ 'footer.legalNotice' | translate }}</span></button>
                </a>
                <a class="legal__notice__a" [routerLink]="['/privacy-policy']">
                    <button><span>{{ 'footer.privacyPolicy' | translate }}</span></button>
                </a>
            </div>
        </div>
        <h2 class="default">&copy; Simon Heistermann {{ currentYear }}</h2>
        <div class="legal__links default">
            <a class="legal__notice__a" [routerLink]="['/legal-notice']">
                <button><span>{{ 'footer.legalNotice' | translate }}</span></button>
            </a>
            <a class="legal__notice__a" [routerLink]="['/privacy-policy']">
                <button><span>{{ 'footer.privacyPolicy' | translate }}</span></button>
            </a>
        </div>
    </div>
</section>
